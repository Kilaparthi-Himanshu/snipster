[package]
name = "snipster"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
url = "2.5"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "bmp"]

[dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "System",
    "ApplicationModel_DataTransfer",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]