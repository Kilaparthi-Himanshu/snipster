[package]
name = "snipster"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
url = "2.5"
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tray-icon = "0.26.1"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "bmp"]

[dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "System",
    "ApplicationModel_DataTransfer",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security",
    "ApplicationModel",
    "ApplicationModel_Activation",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"